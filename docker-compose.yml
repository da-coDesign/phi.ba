services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: phi-ba-postgres
    environment:
      POSTGRES_USER: phi
      POSTGRES_PASSWORD: phi_dev_password
      POSTGRES_DB: phi_ba
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phi -d phi_ba"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    container_name: phi-ba-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  postgres-data:
